<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Scanner - InterviewPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { background-color: #1e293b; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; }
        .scanner-container { max-width: 500px; width: 100%; background: white; color: black; border-radius: 15px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; }
        .manual-entry { margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="text-center mb-4">
        <h2>Security Checkpoint</h2>
        <p class="text-muted text-light">Scan the candidate's QR code to verify interview access.</p>
    </div>

    <div class="scanner-container">
        <div id="reader"></div>
        
        <div class="manual-entry text-center">
            <p class="text-muted small mb-2">Or enter Verification URL manually:</p>
            <div class="input-group">
                <input type="text" id="manualUrl" class="form-control" placeholder="http://.../verify/...">
                <button class="btn btn-primary" onclick="manualVerify()">Verify</button>
            </div>
        </div>
    </div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            // Stop scanning and redirect
            html5QrcodeScanner.clear();
            window.location.href = decodedText;
        }

        function onScanFailure(error) {
            // handle scan failure, usually better to ignore and keep scanning
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: {width: 250, height: 250} },
            /* verbose= */ false);
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);

        function manualVerify() {
            const url = document.getElementById('manualUrl').value;
            if(url) {
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
