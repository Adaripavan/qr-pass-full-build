<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewPass</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', -apple-system, sans-serif; }
        .sidebar { background-color: #1e293b; min-height: 100vh; color: #fff; }
        .sidebar a { color: #cbd5e1; text-decoration: none; padding: 10px 15px; display: block; border-radius: 5px; margin-bottom: 5px; }
        .sidebar a:hover, .sidebar a.active { background-color: #334155; color: #fff; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .stat-card { border-left: 4px solid #3b82f6; }
        .stat-card-success { border-left: 4px solid #10b981; }
        .stat-card-danger { border-left: 4px solid #ef4444; }
        .qr-card-container { max-width: 400px; margin: 0 auto; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .qr-header { background: #1e3a8a; color: white; padding: 20px; text-align: center; }
        .qr-body { padding: 30px; text-align: center; }
        .status-badge { font-size: 1.1em; padding: 8px 20px; border-radius: 30px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-3 d-none d-md-block">
                <h4 class="mb-4 text-center">InterviewPass</h4>
                <a href="{% url 'dashboard' %}" class="{% if request.path == '/' %}active{% endif %}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <a href="{% url 'candidates_list' %}" class="{% if '/candidates/' in request.path %}active{% endif %}"><i class="bi bi-people"></i> Candidates</a>
                <a href="{% url 'scan_history' %}" class="{% if '/history/' in request.path %}active{% endif %}"><i class="bi bi-clock-history"></i> Scan History</a>
                <a href="{% url 'security_scanner' %}" target="_blank"><i class="bi bi-qr-code-scan"></i> Scanner</a>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
